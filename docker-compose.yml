services:
  # Base de Datos PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: tickets_db
    environment:
      POSTGRES_DB: tickets_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tickets-net

  # Backend Spring Boot (misma carpeta donde estás parado)
  tickets_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tickets_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/tickets_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      LLM_API_MODEL: ${LLM_API_MODEL:-gpt-4o-mini}
    depends_on:
      - postgres_db
    networks:
      - tickets-net

  # Frontend React (sube un nivel a "Prueba Software AI" y entra a tickets-frontend)
  tickets_frontend:
    build:
      context: ../tickets-frontend
      dockerfile: Dockerfile.frontend
    container_name: tickets_frontend
    ports:
      - "80:80"
    depends_on:
      - tickets_backend
    networks:
      - tickets-net

volumes:
  postgres_data:

networks:
  tickets-net:
    driver: bridge