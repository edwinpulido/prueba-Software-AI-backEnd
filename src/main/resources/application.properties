spring.application.name=tickets-backend

# Configuraci?n de Base de Datos
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/tickets_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraci?n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuraci?n de LLM (OpenAI-compatible)
llm.api.key=${LLM_API_KEY:}
llm.api.base-url=${LLM_API_BASE_URL:https://api.openai.com/v1}
llm.api.model=${LLM_API_MODEL:gpt-4o-mini}
